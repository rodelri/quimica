name: Compilar APK - Verbos irregulares
on:
  push:
    branches: [build-verbos-romi-2026]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check existing Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then "$SDKMANAGER" "platforms;android-35"; fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then "$SDKMANAGER" "build-tools;35.0.0"; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK with Android Gradle Plugin
        working-directory: android-verbos
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify app and launch activity
        run: |
          test -s android-verbos/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging android-verbos/app/build/outputs/apk/debug/app-debug.apk | grep -E 'package:|launchable-activity:'
      - uses: actions/upload-artifact@v4
        with:
          name: Verbos_Irregulares_RoMi_APK_Gradle
          path: android-verbos/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
